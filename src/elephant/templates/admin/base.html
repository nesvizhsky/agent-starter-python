<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} · Eat the Elephant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"></script>
</head>
<body class="h-full bg-gray-950 text-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-52 shrink-0 bg-gray-900 border-r border-gray-800 flex flex-col">
    <div class="p-4 border-b border-gray-800">
      <div class="text-sm font-bold text-white">🐘 Eat the Elephant</div>
      <div class="text-xs mt-1">
        {% if is_prod %}
          <span class="bg-red-900 text-red-300 px-2 py-0.5 rounded font-semibold">PRODUCTION</span>
        {% else %}
          <span class="bg-green-900 text-green-300 px-2 py-0.5 rounded font-semibold">DEVELOPMENT</span>
        {% endif %}
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-4 text-sm">
      <div>
        <div class="text-xs text-gray-600 uppercase tracking-wider px-3 mb-1">Stats</div>
        <a href="/admin" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-gray-800 {% if active == 'dashboard' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
          📊 Dashboard
        </a>
        <a href="/admin/users" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-gray-800 {% if active == 'users' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
          👤 Users
        </a>
      </div>
      <div>
        <div class="text-xs text-gray-600 uppercase tracking-wider px-3 mb-1">Manage</div>
        <a href="/admin/topics" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-gray-800 {% if active == 'topics' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
          ✏️ Topics
        </a>
        <a href="/admin/bot" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-gray-800 {% if active == 'bot' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
          🤖 Bot
        </a>
      </div>
      <div>
        <div class="text-xs text-gray-600 uppercase tracking-wider px-3 mb-1">System</div>
        <a href="/admin/logs" class="flex items-center gap-2 px-3 py-2 rounded hover:bg-gray-800 {% if active == 'logs' %}bg-gray-800 text-white{% else %}text-gray-400{% endif %}">
          📋 Logs
        </a>
      </div>
    </nav>
    <div class="p-3 border-t border-gray-800">
      <a href="/admin/logout" class="block text-xs text-gray-500 hover:text-gray-300 px-3 py-2">Sign out</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-auto p-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
