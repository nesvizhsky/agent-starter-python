<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · Eat the Elephant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-950 flex items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-2">🐘</div>
      <h1 class="text-xl font-bold text-white">Eat the Elephant</h1>
      <p class="text-sm text-gray-500 mt-1">Admin Panel</p>
    </div>
    <form method="post" class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-4">
      {% if error %}
        <div class="bg-red-950 border border-red-800 text-red-300 text-sm px-3 py-2 rounded">
          {{ error }}
        </div>
      {% endif %}
      <div>
        <label class="block text-xs text-gray-400 mb-1">Username</label>
        <input type="text" name="username" autofocus autocomplete="username"
               class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Password</label>
        <input type="password" name="password" autocomplete="current-password"
               class="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
      </div>
      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-2 rounded transition">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
